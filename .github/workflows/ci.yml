name: CI

# Runs for pull requests and by hand. A push starts nothing.
# Manual run: gh workflow run ci.yml --ref <branch>  (or the "Run workflow" button in Actions).
on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # Installs exactly the Rust version and components from rust-toolchain.toml.
      - name: Install Rust from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install

      # Same checks, in the same order, as `just check`.
      - name: Generate Paraglide i18n files
        run: pnpm vite:build

      - name: Frontend checks
        run: pnpm check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
