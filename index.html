<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Empty on purpose (backlog TASK-18): when the window first gets focus, NVDA names the
         page document before the focused control, so a title here would repeat the window
         title. The window title (tauri.conf.json) stays "AudioCaptor". -->
    <title></title>
    <script>
      // Runs synchronously before first paint — prevents theme flash.
      // Reads the localStorage mirror written by the theme store.
      (function () {
        try {
          var t = localStorage.getItem("audiocaptor_theme") || "auto";
          if (t === "auto") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <!-- role="application" keeps NVDA out of browse mode (backlog doc-3). No aria-label: NVDA
       names the application whenever focus enters it from outside, right after the window
       title, so a name here would repeat "AudioCaptor" (TASK-18). -->
  <body role="application">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
