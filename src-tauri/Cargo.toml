[package]
name = "audio-captor"
version = "0.4.0"
description = "AudioCaptor — system audio recorder"
authors = ["Ruslan Iskov"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "audio_captor_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasapi = "0.17"
hound = "3.5"
rubato = "0.16"
# Opus: libopus (C, built with CMake by opusic-sys) and the Ogg container (decision-8)
opus = "0.4"
ogg = "0.9"
# FLAC: libFLAC (C, built with CMake) without Ogg (decision-10). Its build
# settings come from cmake/msvc-toolchain.cmake, named in .cargo/config.toml.
libflac-sys = { version = "0.3.4", default-features = false, features = ["build-flac"] }
ringbuf = "0.5.2"
crossbeam-channel = "0.5"
rodio = { version = "0.20", default-features = false, features = ["vorbis"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
anyhow = "1"
log = "0.4"

[target.'cfg(windows)'.dependencies]
# Win32_Media_MediaFoundation: the MP3 encoder of Windows (decision-5). Its
# functions are loaded at run time, never imported (convert/media_foundation.rs).
windows = { version = "0.59", features = [
    "Win32_Globalization",
    "Win32_Media_Audio",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Foundation",
] }
windows-core = "0.59"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release-fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
strip = false
panic = "unwind"

